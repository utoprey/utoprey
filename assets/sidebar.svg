<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 460" width="300" height="460" role="img" aria-label="The Transistor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a171c"/>
      <stop offset="0.55" stop-color="#0f2129"/>
      <stop offset="1" stop-color="#0a1a1f"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eafcff"/>
      <stop offset="0.14" stop-color="#ffe3a6"/>
      <stop offset="0.45" stop-color="#ffab2c"/>
      <stop offset="0.8" stop-color="#d94600"/>
      <stop offset="1" stop-color="#ae0500"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9962f"/>
      <stop offset="0.5" stop-color="#e6bf6a"/>
      <stop offset="1" stop-color="#c9962f"/>
    </linearGradient>
    <linearGradient id="plug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a52"/>
      <stop offset="1" stop-color="#1a2a30"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <style>
      @keyframes hum { 0%,100% { opacity:.35 } 50% { opacity:.95 } }
      @keyframes breathe { 0%,100% { transform:scale(1) } 50% { transform:scale(1.025) } }
      @keyframes pulse { 0%,100% { opacity:.5 } 50% { opacity:1 } }
      @keyframes draw { to { stroke-dashoffset:0 } }
      @keyframes blink { 0%,100% { opacity:.9 } 50% { opacity:.35 } }
      .humlayer { animation: hum 3.4s ease-in-out infinite; transform-origin:150px 205px; }
      .sword    { animation: breathe 3.4s ease-in-out infinite; transform-origin:150px 205px; }
      .core     { animation: pulse 2.2s ease-in-out infinite; }
      .sig      { stroke-dasharray:720; stroke-dashoffset:720; animation: draw 2.8s ease-out .4s forwards; }
      .paren    { animation: hum 3.4s ease-in-out infinite; }
      .prong    { animation: blink 2.8s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="1" y="1" width="298" height="458" rx="12" fill="url(#bg)" stroke="#173038" stroke-width="1.5"/>

  <!-- art-nouveau frame -->
  <rect x="14" y="14" width="272" height="432" rx="7" fill="none" stroke="url(#gold)" stroke-width="1.1" opacity="0.85"/>
  <rect x="19" y="19" width="262" height="422" rx="5" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.4"/>
  <g fill="none" stroke="url(#gold)" stroke-width="1.3" opacity="0.9" stroke-linecap="round">
    <path d="M14,44 Q14,14 44,14 M23,36 Q28,23 42,22"/>
    <path d="M256,14 Q286,14 286,44 M258,22 Q272,23 277,36"/>
    <path d="M14,416 Q14,446 44,446 M23,424 Q28,437 42,438"/>
    <path d="M286,416 Q286,446 256,446 M277,424 Q272,437 258,438"/>
  </g>

  <!-- () hum glyph, centered above blade -->
  <g class="paren" fill="none" stroke="#7fe3ff" stroke-width="2" stroke-linecap="round" filter="url(#glow)" transform="translate(0,2)">
    <path d="M142,26 Q134,38 142,50"/>
    <path d="M158,26 Q166,38 158,50"/>
  </g>

  <!-- vertical brain-signal trace = the hum -->
  <path class="sig" filter="url(#glow)" fill="none" stroke="#33ddff" stroke-width="1.4" opacity="0.6"
        d="M74,64 L74,150 L64,166 L84,182 L64,198 L74,214 L74,300 L64,316 L84,332 L64,348 L74,364 L74,404"/>
  <circle r="2.6" fill="#d7fbff" filter="url(#glow)">
    <animateMotion dur="5.5s" repeatCount="indefinite" calcMode="linear"
      path="M74,64 L74,150 L64,166 L84,182 L64,198 L74,214 L74,300 L64,316 L84,332 L64,348 L74,364 L74,404"/>
  </circle>

  <!-- THE TRANSISTOR: straight parallel edges, angled chisel tip, plug base -->
  <g>
    <rect class="humlayer" x="126" y="54" width="48" height="300" rx="10" fill="#33ddff" filter="url(#softglow)"/>
    <g class="sword">
      <!-- blade -->
      <path d="M130,96 L170,48 L170,352 L130,352 Z" fill="url(#blade)" filter="url(#glow)"/>
      <!-- glowing cutting edge (slanted tip + right edge) -->
      <path d="M130,96 L170,48 L170,352" fill="none" stroke="#eafcff" stroke-width="1.6" opacity="0.9"/>
      <!-- center fuller -->
      <line x1="150" y1="70" x2="150" y2="346" stroke="#fff4e0" stroke-width="1" opacity="0.65"/>
      <!-- circuit nodes -->
      <g stroke="#33ddff" stroke-width="1.3" opacity="0.85">
        <line x1="137" y1="150" x2="163" y2="150"/>
        <line x1="137" y1="210" x2="163" y2="210"/>
        <line x1="137" y1="270" x2="163" y2="270"/>
      </g>
      <!-- glowing core -->
      <rect x="136" y="300" width="28" height="16" rx="3" fill="none" stroke="#e6bf6a" stroke-width="1.2" opacity="0.85"/>
      <circle class="core" cx="150" cy="308" r="4" fill="#eafcff" filter="url(#glow)"/>
    </g>
    <!-- plug / connector base -->
    <g filter="url(#glow)">
      <rect x="122" y="352" width="56" height="34" rx="4" fill="url(#plug)" stroke="#e6bf6a" stroke-width="1.2"/>
      <line x1="132" y1="360" x2="168" y2="360" stroke="#33ddff" stroke-width="1" opacity="0.6"/>
      <line x1="132" y1="368" x2="168" y2="368" stroke="#33ddff" stroke-width="1" opacity="0.4"/>
      <g class="prong" fill="#c9962f">
        <rect x="130" y="386" width="6" height="12" rx="1"/>
        <rect x="143" y="386" width="6" height="12" rx="1"/>
        <rect x="156" y="386" width="6" height="12" rx="1"/>
        <rect x="169" y="386" width="6" height="12" rx="1"/>
      </g>
    </g>
  </g>
</svg>
