<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="880" height="210" role="img" aria-label="Katherine Antipushina — AI for Neuroscience and Embodied AI Researcher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a171c"/>
      <stop offset="0.55" stop-color="#0f2129"/>
      <stop offset="1" stop-color="#0a1a1f"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27f"/>
      <stop offset="0.35" stop-color="#ffab2c"/>
      <stop offset="0.75" stop-color="#d94600"/>
      <stop offset="1" stop-color="#ae0500"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9962f"/>
      <stop offset="0.5" stop-color="#e6bf6a"/>
      <stop offset="1" stop-color="#c9962f"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <style>
      @keyframes hum { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes breathe { 0%,100% { transform:scale(1) } 50% { transform:scale(1.04) } }
      @keyframes flicker { 0%,100% { opacity:.85 } 45% { opacity:1 } 60% { opacity:.7 } }
      @keyframes draw { to { stroke-dashoffset:0 } }
      .humlayer { animation: hum 3.2s ease-in-out infinite; transform-origin:64px 105px; }
      .blade    { animation: breathe 3.2s ease-in-out infinite; transform-origin:64px 105px; }
      .name     { animation: flicker 6s ease-in-out infinite; }
      .wave     { stroke-dasharray:900; stroke-dashoffset:900; animation: draw 3s ease-out .3s forwards; }
    </style>
  </defs>

  <!-- panel -->
  <rect x="1" y="1" width="878" height="208" rx="10" fill="url(#bg)" stroke="#173038" stroke-width="1.5"/>

  <!-- art-nouveau gold frame -->
  <rect x="14" y="14" width="852" height="182" rx="6" fill="none" stroke="url(#gold)" stroke-width="1.1" opacity="0.85"/>
  <rect x="19" y="19" width="842" height="172" rx="4" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.4"/>
  <!-- corner flourishes -->
  <g fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.9" stroke-linecap="round">
    <path d="M14,40 Q14,14 40,14 M22,34 Q26,22 40,22"/>
    <path d="M840,14 Q866,14 866,40 M840,22 Q854,22 858,34"/>
    <path d="M14,170 Q14,196 40,196 M22,176 Q26,188 40,188"/>
    <path d="M866,170 Q866,196 840,196 M858,176 Q854,188 840,188"/>
  </g>

  <!-- Transistor blade -->
  <g>
    <ellipse class="humlayer" cx="64" cy="105" rx="20" ry="78" fill="#33ddff" filter="url(#softglow)"/>
    <g class="blade" filter="url(#glow)">
      <path d="M64,30 L74,92 L70,178 L64,186 L58,178 L54,92 Z" fill="url(#blade)"/>
      <line x1="64" y1="40" x2="64" y2="172" stroke="#fff4e0" stroke-width="1.1" opacity="0.9"/>
      <path d="M46,96 L82,96" stroke="#e6bf6a" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="64" cy="96" r="3.6" fill="#fff4e0"/>
    </g>
  </g>

  <!-- name + tagline -->
  <text class="name" x="118" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="37" font-weight="500"
        letter-spacing="5" fill="url(#gold)">KATHERINE ANTIPUSHINA</text>
  <text x="120" y="124" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="2.6"
        fill="#8fe6ff">AI for Neuroscience &amp; Embodied AI Researcher</text>

  <!-- EEG "hum" waveform -->
  <path class="wave" filter="url(#glow)" fill="none" stroke="#33ddff" stroke-width="1.6" opacity="0.75"
        d="M120,158 L300,158 L318,158 L330,140 L342,176 L356,150 L368,158 L560,158 L576,158 L588,138 L600,172 L613,150 L626,158 L760,158"/>
  <circle r="3" fill="#d7fbff" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"
      path="M120,158 L300,158 L318,158 L330,140 L342,176 L356,150 L368,158 L560,158 L576,158 L588,138 L600,172 L613,150 L626,158 L760,158"/>
  </circle>
</svg>
